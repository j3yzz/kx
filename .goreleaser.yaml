version: 2

before:
  hooks:
    - go test ./...

builds:
  - main: .
    binary: kx
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/j3yzz/kx/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "kx_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  replace_existing_artifacts: true

# Pushes the formula to j3yzz/homebrew-kx over SSH with a write deploy key
# (secret HOMEBREW_TAP_DEPLOY_KEY; the workflow writes it to a file).
brews:
  - repository:
      owner: j3yzz
      name: homebrew-kx
      branch: main
      git:
        url: git@github.com:j3yzz/homebrew-kx.git
        private_key: "{{ .Env.HOMEBREW_TAP_KEY_PATH }}"
    homepage: https://github.com/j3yzz/kx
    description: Faster Kubernetes CLI - exec, forward and secrets by application name
    test: |
      assert_match "kx version", shell_output("#{bin}/kx --version")

apiVersion: v1
kind: Namespace
metadata:
  name: kx-test
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: kx-test
stringData:
  password: s3cr3t-integration
  user: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: kx-test
data:
  REGION: eu
---
# Logs a line per second: exercises kx logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatty
  namespace: kx-test
spec:
  selector:
    matchLabels: {app: chatty}
  template:
    metadata:
      labels: {app: chatty}
    spec:
      containers:
        - name: main
          image: alpine:3.20
          command: [sh, -c, "while true; do echo hello-from-chatty; sleep 1; done"]
---
# No bash: exercises the sh fallback. Uses the Secret via env and a volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpine
  namespace: kx-test
spec:
  selector:
    matchLabels: {app: alpine}
  template:
    metadata:
      labels: {app: alpine}
    spec:
      containers:
        - name: main
          image: alpine:3.20
          command: [sleep, infinity]
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: LOG_LEVEL
              value: debug
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secret, key: password}
          volumeMounts:
            - {name: creds, mountPath: /etc/creds}
      volumes:
        - name: creds
          secret: {secretName: app-secret}
---
# Has bash: exercises the bash-first path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bashy
  namespace: kx-test
spec:
  selector:
    matchLabels: {app: bashy}
  template:
    metadata:
      labels: {app: bashy}
    spec:
      containers:
        - name: main
          image: bash:5.2
          command: [sleep, infinity]
---
# Declares exactly one port: exercises default port + forward recovery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: kx-test
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: main
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
